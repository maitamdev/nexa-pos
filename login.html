<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Đăng Nhập Cổng Quản Trị Cửa Hàng</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Đăng nhập cổng quản lý nhân viên của NexaPOS dành cho chủ cửa hàng.">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(16, 23, 42, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Glow effects */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(99, 102, 241, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(99, 102, 241, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 1;
        }

        .glow-1 {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.1);
            filter: blur(130px);
            pointer-events: none;
            z-index: 1;
        }

        .glow-2 {
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.1);
            filter: blur(130px);
            pointer-events: none;
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #a855f7 100%);
            border-radius: 16px;
            font-size: 28px;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.25);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #4b5563;
            font-size: 16px;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(8, 12, 22, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(8, 12, 22, 0.9);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
        }

        .form-input:focus + .input-icon {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Message popup */
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .message-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error-color);
        }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="header">
                <div class="logo-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <h1 class="title">Đăng Nhập Quản Trị</h1>
                <p class="subtitle">Truy cập Cổng quản lý nhân viên cửa hàng của bạn</p>
            </div>

            <div id="msg-error" class="message message-error">
                <i class="fa-solid fa-triangle-exclamation" style="flex-shrink: 0;"></i>
                <span id="msg-error-text">Đã xảy ra lỗi</span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Đăng Nhập</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="email" id="email" required placeholder="admin@company.com">
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật Khẩu</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="password" required placeholder="••••••••">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <button class="btn-submit" type="submit" id="btn-submit">
                    <span id="btn-text">Đăng Nhập</span>
                </button>
            </form>

            <div class="footer-links">
                Chưa đăng ký cửa hàng? <a href="register.html">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script>
        // Redirect to portal if already logged in
        if (localStorage.getItem('webToken') && localStorage.getItem('webUser')) {
            window.location.href = 'portal.html';
        }

        const form = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const msgError = document.getElementById('msg-error');
        const msgErrorText = document.getElementById('msg-error-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgError.style.display = 'none';
            btnSubmit.disabled = true;
            btnText.innerText = 'Đang xác thực...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Save session details
                    localStorage.setItem('webToken', result.token);
                    localStorage.setItem('webUser', JSON.stringify(result.employee));
                    // Redirect to portal
                    window.location.href = 'portal.html';
                } else {
                    throw new Error(result.error || 'Đăng nhập không thành công!');
                }
            } catch (err) {
                msgErrorText.innerText = err.message;
                msgError.style.display = 'flex';
                btnSubmit.disabled = false;
                btnText.innerText = 'Đăng Nhập';
            }
        });
    </script>
</body>
</html>
