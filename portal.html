<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPOS - Cổng Quản Lý Nhân Viên</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Quản lý nhân viên cửa hàng trên nền tảng đám mây NexaPOS.">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(16, 23, 42, 0.4);
            --border-color: rgba(255, 255, 255, 0.05);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Glow effects */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(99, 102, 241, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(99, 102, 241, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 1;
        }

        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.08);
            filter: blur(100px);
            pointer-events: none;
            z-index: 1;
        }

        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.08);
            filter: blur(100px);
            pointer-events: none;
            z-index: 1;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Header block */
        header {
            display: flex;
            justify-content: justify;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-b: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #a855f7 100%);
            border-radius: 12px;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.2);
        }

        .store-title {
            font-size: 20px;
            font-weight: 850;
            background: linear-gradient(to right, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .store-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: 'Inter', sans-serif;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .user-info {
            text-align: right;
            font-size: 13px;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-color);
        }

        .user-role {
            font-size: 10px;
            color: var(--primary-color);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn-logout {
            padding: 10px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            color: var(--error-color);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: var(--error-color);
            color: #fff;
        }

        /* Main Workspace */
        .workspace-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .workspace-header {
            display: flex;
            justify-content: justify;
            align-items: center;
            margin-bottom: 28px;
        }

        .workspace-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
            margin-left: auto;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
        }

        /* Employee Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            background: rgba(8, 12, 22, 0.3);
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(8, 12, 22, 0.6);
        }

        td {
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .emp-name-cell {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: #fff;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-admin { background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.2); }
        .badge-manager { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-cashier { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-inventory { background: rgba(6, 182, 212, 0.1); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.2); }

        .status-toggle {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .status-active:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .status-inactive:hover {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
            padding: 4px;
        }

        .btn-action-edit:hover { color: var(--primary-color); }
        .btn-action-delete:hover { color: var(--error-color); }

        /* Loader & Empty states */
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .loading-spinner i {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 15, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .modal-card {
            background: #090e1a;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            position: relative;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: justify;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            transition: color 0.2s;
            margin-left: auto;
        }

        .modal-close:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(8, 12, 22, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.1);
        }

        select.form-input {
            cursor: pointer;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-cancel {
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* Simple notification toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 200;
            animation: toastIn 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes toastIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .store-id-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
        }

        .store-id-badge:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            border-color: rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <!-- Dashboard Header -->
        <header>
            <div class="header-brand">
                <div class="logo-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div>
                    <h1 class="store-title" id="display-store-name">Cửa hàng của bạn</h1>
                    <div style="display: flex; align-items: center; margin-top: 2px;">
                        <span class="store-subtitle">Quản trị Hệ thống Đồng bộ</span>
                        <span class="store-id-badge" id="btn-copy-store-id" title="Click để sao chép Store ID">
                            ID: <span id="display-store-id">...</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="header-actions">
                <div class="user-info">
                    <div class="user-name" id="display-user-name">Quản trị viên</div>
                    <div class="user-role">Chủ cửa hàng (ADMIN)</div>
                </div>
                <button class="btn-logout" id="btn-logout"><i class="fa-solid fa-sign-out"></i> Đăng xuất</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace-card">
            <div class="workspace-header">
                <h2 class="workspace-title">
                    <i class="fa-solid fa-users text-indigo-400"></i> Quản lý tài khoản Nhân viên
                </h2>
                <button class="btn-add" id="btn-open-add-modal"><i class="fa-solid fa-plus"></i> Thêm tài khoản mới</button>
            </div>

            <!-- Loader -->
            <div id="table-loader" class="loading-spinner">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>Đang tải danh sách nhân viên...</p>
            </div>

            <!-- Employee List View -->
            <div class="table-responsive" id="table-container" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Tên nhân viên</th>
                            <th>Email đăng nhập</th>
                            <th>Vai trò</th>
                            <th>Trạng thái hoạt động</th>
                            <th>Ngày khởi tạo</th>
                            <th style="width: 100px; text-align: center;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="employee-list-tbody">
                        <!-- Dynamic rows loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Employee Modal -->
    <div class="modal" id="employee-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title-text">Thêm tài khoản nhân viên</h3>
                <button class="modal-close" id="btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="modal-msg-error" class="message message-error" style="margin-bottom: 16px;">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="modal-msg-error-text">Lỗi</span>
            </div>

            <form id="employee-form">
                <input type="hidden" id="edit-employee-id">

                <div class="form-group">
                    <label class="form-label" for="emp-name">Họ và Tên Nhân viên</label>
                    <input class="form-input" type="text" id="emp-name" required placeholder="Ví dụ: Nguyễn Văn B">
                </div>

                <div class="form-group">
                    <label class="form-label" for="emp-email">Email Đăng Nhập</label>
                    <input class="form-input" type="email" id="emp-email" required placeholder="staff@store.com">
                </div>

                <div class="form-group" id="password-group">
                    <label class="form-label" for="emp-password" id="password-label">Mật Khẩu</label>
                    <input class="form-input" type="password" id="emp-password" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                    <p style="font-size: 10px; color: var(--text-muted); margin-top: 4px;" id="password-hint"></p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="emp-role">Vai trò hệ thống</label>
                    <select class="form-input" id="emp-role" required>
                        <option value="CASHIER">Thu ngân (Bán hàng & POS)</option>
                        <option value="MANAGER">Quản lý cửa hàng (Xem báo cáo & Nhân viên)</option>
                        <option value="INVENTORY">Thủ kho (Quản lý sản phẩm & Kho hàng)</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel-modal">Hủy bỏ</button>
                    <button type="submit" class="btn-add" id="btn-submit-modal">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast message popup -->
    <div class="toast" id="toast-popup">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-text">Thông báo thành công!</span>
    </div>

    <script>
        // Check Auth Session
        const token = localStorage.getItem('webToken');
        const userStr = localStorage.getItem('webUser');
        
        if (!token || !userStr) {
            window.location.href = 'login.html';
        }

        const user = JSON.parse(userStr);
        document.getElementById('display-store-name').innerText = user.storeName || 'Cửa hàng NexaPOS';
        document.getElementById('display-store-id').innerText = user.storeId || '...';
        document.getElementById('display-user-name').innerText = user.name || 'Quản trị viên';

        // State Manager
        let employees = [];
        let isEditMode = false;

        const loader = document.getElementById('table-loader');
        const tableContainer = document.getElementById('table-container');
        const tbody = document.getElementById('employee-list-tbody');

        const modal = document.getElementById('employee-modal');
        const modalForm = document.getElementById('employee-form');
        const modalTitle = document.getElementById('modal-title-text');
        const editEmpIdInput = document.getElementById('edit-employee-id');
        const empNameInput = document.getElementById('emp-name');
        const empEmailInput = document.getElementById('emp-email');
        const empPasswordInput = document.getElementById('emp-password');
        const empRoleSelect = document.getElementById('emp-role');
        const modalMsgError = document.getElementById('modal-msg-error');
        const modalMsgErrorText = document.getElementById('modal-msg-error-text');
        const passwordGroup = document.getElementById('password-group');
        const passwordLabel = document.getElementById('password-label');
        const passwordHint = document.getElementById('password-hint');

        // Copy Store ID
        document.getElementById('btn-copy-store-id').addEventListener('click', () => {
            navigator.clipboard.writeText(user.storeId).then(() => {
                showToast('Đã sao chép Store ID vào Clipboard!');
            });
        });

        // Show Toast Function
        function showToast(message) {
            const toast = document.getElementById('toast-popup');
            document.getElementById('toast-text').innerText = message;
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Fetch Employees
        async function fetchEmployees() {
            try {
                const response = await fetch('/api/employees', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    // Session expired
                    localStorage.removeItem('webToken');
                    localStorage.removeItem('webUser');
                    window.location.href = 'login.html';
                    return;
                }

                const result = await response.json();
                if (response.ok && result.success) {
                    employees = result.data;
                    renderEmployees();
                } else {
                    alert(result.error || 'Lỗi tải danh sách nhân viên');
                }
            } catch (e) {
                console.error(e);
                alert('Không thể kết nối đến máy chủ API: ' + e.message);
            }
        }

        // Translate roles
        function translateRole(role) {
            switch(role) {
                case 'ADMIN': return '<span class="badge badge-admin">Chủ cửa hàng</span>';
                case 'MANAGER': return '<span class="badge badge-manager">Quản lý</span>';
                case 'CASHIER': return '<span class="badge badge-cashier">Thu ngân</span>';
                case 'INVENTORY': return '<span class="badge badge-inventory">Thủ kho</span>';
                default: return role;
            }
        }

        // Format dates
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
        }

        // Render table
        function renderEmployees() {
            tbody.innerHTML = '';
            
            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Chưa có tài khoản nhân viên nào được tạo.</td></tr>';
            } else {
                employees.forEach(emp => {
                    const tr = document.createElement('tr');
                    
                    const isSelf = emp.id === user.id;
                    const statusClass = emp.isActive ? 'status-active' : 'status-inactive';
                    const statusLabel = emp.isActive ? 'Hoạt động' : 'Tạm khóa';
                    
                    // Disallow editing owner role/status on this page to prevent lockout
                    const statusToggleHtml = isSelf 
                        ? `<span class="badge badge-admin">Chủ sở hữu</span>` 
                        : `<button class="status-toggle ${statusClass}" onclick="toggleEmployeeStatus('${emp.id}', ${emp.isActive})" title="Bấm để thay đổi trạng thái">${statusLabel}</button>`;

                    const actionButtonsHtml = isSelf
                        ? `<span style="font-size: 11px; color: var(--text-muted); font-style: italic;">Không khả dụng</span>`
                        : `<div class="action-btns">
                            <button class="btn-action btn-action-edit" onclick="openEditModal('${emp.id}')" title="Chỉnh sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn-action btn-action-delete" onclick="deleteEmployee('${emp.id}', '${emp.name}')" title="Xóa tài khoản"><i class="fa-solid fa-trash"></i></button>
                          </div>`;

                    tr.innerHTML = `
                        <td class="emp-name-cell">${emp.name}</td>
                        <td>${emp.email}</td>
                        <td>${translateRole(emp.role)}</td>
                        <td>${statusToggleHtml}</td>
                        <td>${formatDate(emp.createdAt)}</td>
                        <td style="text-align: center;">${actionButtonsHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            loader.style.display = 'none';
            tableContainer.style.display = 'block';
        }

        // Toggle Status
        async function toggleEmployeeStatus(id, currentStatus) {
            const emp = employees.find(e => e.id === id);
            if (!emp) return;

            const confirmMsg = currentStatus 
                ? `Bạn có chắc chắn muốn TẠM KHÓA nhân viên "${emp.name}"? Nhân viên này sẽ không thể đăng nhập ứng dụng Desktop POS.`
                : `Bạn có chắc chắn muốn KÍCH HOẠT lại nhân viên "${emp.name}"?`;
            
            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch('/api/employees', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        id,
                        name: emp.name,
                        role: emp.role,
                        isActive: !currentStatus
                    })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    showToast(currentStatus ? 'Đã tạm khóa tài khoản nhân viên!' : 'Đã mở khóa tài khoản nhân viên!');
                    fetchEmployees();
                } else {
                    alert(result.error || 'Cập nhật trạng thái thất bại');
                }
            } catch (e) {
                alert('Lỗi kết nối cơ sở dữ liệu: ' + e.message);
            }
        }

        // Delete Employee
        async function deleteEmployee(id, name) {
            if (!confirm(`CẢNH BÁO: Bạn có chắc chắn muốn XÓA vĩnh viễn tài khoản nhân viên "${name}"? Thao tác này không thể hoàn tác!`)) {
                return;
            }

            try {
                const response = await fetch('/api/employees', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ id })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    showToast('Đã xóa tài khoản nhân viên thành công!');
                    fetchEmployees();
                } else {
                    alert(result.error || 'Xóa nhân viên thất bại');
                }
            } catch (e) {
                alert('Lỗi kết nối cơ sở dữ liệu: ' + e.message);
            }
        }

        // Open Modal Add
        document.getElementById('btn-open-add-modal').addEventListener('click', () => {
            isEditMode = false;
            modalTitle.innerText = 'Thêm tài khoản nhân viên mới';
            editEmpIdInput.value = '';
            empNameInput.value = '';
            empEmailInput.value = '';
            empEmailInput.disabled = false;
            empPasswordInput.value = '';
            empPasswordInput.required = true;
            passwordLabel.innerText = 'Mật khẩu';
            passwordHint.innerText = '';
            empRoleSelect.value = 'CASHIER';
            modalMsgError.style.display = 'none';
            modal.style.display = 'flex';
        });

        // Open Modal Edit
        window.openEditModal = function(id) {
            const emp = employees.find(e => e.id === id);
            if (!emp) return;

            isEditMode = true;
            modalTitle.innerText = `Cập nhật thông tin: ${emp.name}`;
            editEmpIdInput.value = emp.id;
            empNameInput.value = emp.name;
            empEmailInput.value = emp.email;
            empEmailInput.disabled = true; // Email is not editable
            empPasswordInput.value = '';
            empPasswordInput.required = false; // Optional in edit mode
            passwordLabel.innerText = 'Đặt lại mật khẩu (Tùy chọn)';
            passwordHint.innerText = 'Chỉ nhập nếu bạn muốn đổi mật khẩu mới cho nhân viên này.';
            empRoleSelect.value = emp.role;
            modalMsgError.style.display = 'none';
            modal.style.display = 'flex';
        };

        // Close Modals
        function closeModal() {
            modal.style.display = 'none';
        }
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

        // Submit Form Add/Edit
        modalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            modalMsgError.style.display = 'none';

            const id = editEmpIdInput.value;
            const name = empNameInput.value.trim();
            const email = empEmailInput.value.trim();
            const password = empPasswordInput.value;
            const role = empRoleSelect.value;

            // Submit Payload
            const method = isEditMode ? 'PUT' : 'POST';
            const bodyObj = isEditMode 
                ? { id, name, role, isActive: employees.find(emp => emp.id === id).isActive } 
                : { name, email, password, role };
            
            if (isEditMode && password) {
                bodyObj.password = password;
            }

            try {
                const response = await fetch('/api/employees', {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(bodyObj)
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    showToast(isEditMode ? 'Cập nhật nhân viên thành công!' : 'Thêm nhân viên thành công!');
                    closeModal();
                    fetchEmployees();
                } else {
                    throw new Error(result.error || 'Có lỗi xảy ra khi lưu nhân viên!');
                }
            } catch (err) {
                modalMsgErrorText.innerText = err.message;
                modalMsgError.style.display = 'flex';
            }
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            if (confirm('Bạn có chắc chắn muốn đăng xuất khỏi Cổng quản lý?')) {
                localStorage.removeItem('webToken');
                localStorage.removeItem('webUser');
                window.location.href = 'login.html';
            }
        });

        // Load initial data
        fetchEmployees();
    </script>
</body>
</html>
